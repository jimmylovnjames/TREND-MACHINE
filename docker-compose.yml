# Local infrastructure for development against real Postgres (optional —
# without DATABASE_URL the app uses embedded PGlite).
#   docker compose up -d
#   DATABASE_URL=postgres://tm:tm@localhost:5432/trend_machine npm run db:setup
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tm
      POSTGRES_PASSWORD: tm
      POSTGRES_DB: trend_machine
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  # S3-compatible private storage for testing STORAGE_DRIVER=s3.
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: tmminio
      MINIO_ROOT_PASSWORD: tmminio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
